spring.application.name=miadvisor-backend
server.port=${PORT:8080}

# Defaults match docker-compose.yml; override via env vars in prod (Railway / Tiger Data)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/coursecompass}
spring.datasource.username=${DATABASE_USERNAME:coursecompass}
spring.datasource.password=${DATABASE_PASSWORD:coursecompass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# HS256 signing key, at least 32 bytes. If unset, a random key is generated at startup
# (tokens stop working after a restart). Always set JWT_SECRET in deployed environments.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=PT24H

# Comma-separated list of frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Gemini rewrites recommendation reasoning in plain language. Leave GEMINI_API_KEY unset to use the
# built-in template text instead.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.timeout=PT10S

# ElevenLabs reads the course briefing aloud. Leave ELEVENLABS_API_KEY unset to hide the Listen button.
# Default voice: "Sarah" (warm, calm). Override with any voice ID from the ElevenLabs voice library.
elevenlabs.api-key=${ELEVENLABS_API_KEY:}
elevenlabs.voice-id=${ELEVENLABS_VOICE_ID:EXAVITQu4vr4xnSDxMaL}
elevenlabs.model=${ELEVENLABS_MODEL:eleven_multilingual_v2}
elevenlabs.base-url=https://api.elevenlabs.io/v1
elevenlabs.timeout=PT30S

# AI request caps (protect the Gemini free-tier quota). Per user: N generations per window.
# Global: total Gemini calls per minute across all users.
app.ai.user-limit=${AI_USER_LIMIT:10}
app.ai.user-window=${AI_USER_WINDOW:PT10M}
app.ai.global-limit-per-minute=${AI_GLOBAL_LIMIT_PER_MINUTE:15}

# Syllabus / notes PDF uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# How long model metrics are cached before re-reading them from the ML service
ml.model-info-ttl=${ML_MODEL_INFO_TTL:PT5M}
