spring.application.name=coursecompass-backend
server.port=${PORT:8080}

# Defaults match docker-compose.yml; override via env vars in prod (Railway / Tiger Data)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/coursecompass}
spring.datasource.username=${DATABASE_USERNAME:coursecompass}
spring.datasource.password=${DATABASE_PASSWORD:coursecompass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# HS256 signing key, at least 32 bytes. If unset, a random key is generated at startup
# (tokens stop working after a restart). Always set JWT_SECRET in deployed environments.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=PT24H

# Comma-separated list of frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
