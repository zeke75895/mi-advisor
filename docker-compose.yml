# Fixed project name so the data volume (coursecompass_pgdata) survives renaming the folder
name: coursecompass

services:
  postgres:
    image: postgres:16
    container_name: coursecompass-postgres
    environment:
      POSTGRES_DB: coursecompass
      POSTGRES_USER: coursecompass
      POSTGRES_PASSWORD: coursecompass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coursecompass -d coursecompass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
